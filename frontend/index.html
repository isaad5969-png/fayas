    <!-- ════════════════════════════════════════════════════
         Premium pre-mount loader (no flash, smooth UX)
    ════════════════════════════════════════════════════ -->
    <style>
      /* Variables synced with site palette */
      :root {
        --brand: #7C3AED;
        --brand-light: #A855F7;
        --accent: #EC4899;
      }

      /* Anti-flash: hide root until React hydrates */
      html, body { margin: 0; padding: 0; background: #f9fafb; }
      html.dark, html.dark body { background: #030712; }

      /* Loader styles */
      #app-loader {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: linear-gradient(135deg, #faf5ff 0%, #ffffff 60%, #fdf2f8 100%);
        z-index: 9999;
        transition: opacity 0.4s ease, visibility 0.4s ease;
        font-family: 'Geist', 'Inter', system-ui, sans-serif;
      }
      html.dark #app-loader {
        background: linear-gradient(135deg, #0d0a17 0%, #0a0a0f 60%, #0f0b1e 100%);
      }
      #app-loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

      /* Animated logo with gradient */
      .loader-logo {
        width: 72px; height: 72px;
        border-radius: 18px;
        background: linear-gradient(135deg, #7C3AED 0%, #A855F7 50%, #EC4899 100%);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 20px 60px -10px rgba(124, 58, 237, 0.5),
                    inset 0 1px 0 rgba(255, 255, 255, 0.3);
        animation: loader-pulse 1.6s ease-in-out infinite,
                   loader-rotate 12s linear infinite;
        margin-bottom: 22px;
      }
      .loader-logo svg { width: 36px; height: 36px; color: white; }

      @keyframes loader-pulse {
        0%, 100% { box-shadow: 0 20px 60px -10px rgba(124, 58, 237, 0.5),
                               inset 0 1px 0 rgba(255, 255, 255, 0.3),
                               0 0 0 0 rgba(168, 85, 247, 0.5); }
        50%      { box-shadow: 0 25px 80px -10px rgba(168, 85, 247, 0.7),
                               inset 0 1px 0 rgba(255, 255, 255, 0.4),
                               0 0 0 16px rgba(168, 85, 247, 0); }
      }
      @keyframes loader-rotate {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }

      /* Brand name with gradient text */
      .loader-brand {
        font-size: 22px; font-weight: 800; letter-spacing: -0.02em;
        background: linear-gradient(90deg, #7C3AED, #A855F7, #EC4899);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: gradient-shift 3s ease infinite;
        margin-bottom: 4px;
      }
      @keyframes gradient-shift {
        0%, 100% { background-position: 0% center; }
        50%      { background-position: 100% center; }
      }

      /* Subtitle */
      .loader-sub {
        font-size: 12px; font-weight: 500; letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #9CA3AF;
      }
      html.dark .loader-sub { color: #6B7280; }

      /* Spinner dots */
      .loader-dots {
        display: flex; gap: 6px; margin-top: 24px;
      }
      .loader-dots span {
        width: 7px; height: 7px; border-radius: 50%;
        background: linear-gradient(135deg, #7C3AED, #EC4899);
        animation: loader-dot 1.4s ease-in-out infinite;
      }
      .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
      .loader-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes loader-dot {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
        40%           { transform: scale(1);   opacity: 1; }
      }

      /* No-JS fallback */
      .nojs-fallback {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        padding: 24px; text-align: center;
        font-family: 'Geist', 'Inter', system-ui, sans-serif;
        background: #faf5ff; color: #1f2937;
      }
      .nojs-fallback h1 { font-size: 28px; margin: 0 0 12px; color: #7C3AED; }
      .nojs-fallback p  { font-size: 15px; max-width: 460px; line-height: 1.6; color: #6B7280; }
    </style>

    <!-- ════════════════════════════════════════════════════
         Application React mount point
    ════════════════════════════════════════════════════ -->
    <div id="root"></div>

    <!-- ════════════════════════════════════════════════════
         Bootstrap React + cacher loader après mount
    ════════════════════════════════════════════════════ -->
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Hide loader once React has mounted content into #root
      (function(){
        var loader = document.getElementById('app-loader');
        if (!loader) return;
        var root = document.getElementById('root');
        var done = false;
        function hide() {
          if (done) return;
          done = true;
          loader.classList.add('hidden');
          setTimeout(function(){ if (loader.parentNode) loader.parentNode.removeChild(loader); }, 500);
        }
        function mounted() {
          return root && root.children && root.children.length > 0;
        }
        if (mounted()) return hide();
        // React can take >1.6s in dev (Vite compile) — observe #root instead of
        // racing a fixed frame cap, so the loader never sticks on a slow mount.
        if (window.MutationObserver && root) {
          var obs = new MutationObserver(function(){
            if (mounted()) { obs.disconnect(); hide(); }
          });
          obs.observe(root, { childList: true });
        }
        // Absolute safety net: never let the loader cover the app forever.
        setTimeout(hide, 10000);
      })();
    </script>
